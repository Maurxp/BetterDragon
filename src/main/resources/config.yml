# ==============================================================================
# BETTERDRAGON — CONFIGURACIÓN PRODUCTIVA BASE
# Versión: 0.1.0-SNAPSHOT
# Autor: maurxp
# ==============================================================================

# Control del portal de salida de bedrock
portal:
  # Cuando portal.enabled es false:
  # BetterDragon NO crea, NO modifica, NO restaura y NO administra el portal
  # de salida de bedrock vanilla en la arena del End.
  # Cuando portal.enabled es true:
  # BetterDragon permite la gestión del portal central tras la victoria.
  enabled: false

# Opciones de logging y depuración
logging:
  # Nivel de detalle en consola: INFO, WARNING, SEVERE
  level: "INFO"
  # Habilitar mensajes de diagnóstico detallados de combate
  debug: false

# ==============================================================================
# FASES DE COMBATE Y HABILIDADES (FASE 3.5)
# ==============================================================================

# Catálogo declarativo de habilidades disponibles para el dragón
# Por defecto se provee un catálogo vacío sin moveset predeterminado
abilities: {}

# Definición de dragones y sus fases de combate ordenadas
dragons:
  default:
    phases:
      - id: "phase_1"
        threshold: 1.00
        abilities: []
      - id: "phase_2"
        threshold: 0.75
        abilities: []
      - id: "phase_3"
        threshold: 0.50
        abilities: []
      - id: "phase_4"
        threshold: 0.25
        abilities: []

# ==============================================================================
# SISTEMA DE RECOMPENSAS (FASE 3.8)
# ==============================================================================
rewards:
  # Activar o desactivar la asignación y entrega de recompensas tras la victoria
  # Seguro por defecto: desactivado hasta configuración explícita del servidor
  enabled: false

  # Porcentaje mínimo de daño sobre el total de la batalla para ser elegible (0.0 a 100.0)
  # Participantes con daño menor no reciben del pool; su parte se redistribuye proporcionalmente.
  # 0.0 es el valor técnico neutro predeterminado cuando rewards está deshabilitado.
  min_participation_percent: 0.0

  # Pool de ítems a repartir proporcionalmente entre participantes elegibles
  # Por defecto vacío sin recompensas de gameplay inventadas.
  # Ejemplo de sintaxis:
  #   items:
  #     - id: "participation_item_example"
  #       material: "DIAMOND"
  #       amount: 5
  participation_pool:
    items: []

  # Recompensa adicional y exclusiva para el Slayer de la batalla (TOP_DAMAGE)
  # Deshabilitado por defecto sin ítems inventados.
  # Ejemplo de sintaxis:
  #   items:
  #     - id: "slayer_reward_example"
  #       material: "NETHERITE_INGOT"
  #       amount: 1
  slayer_reward:
    enabled: false
    # Si es true, el Slayer debe alcanzar min_participation_percent para recibir esta recompensa
    requires_eligibility: true
    items: []
