# ==============================================================================
# BETTERDRAGON — CONFIGURACIÓN PRODUCTIVA BASE
# Versión: 0.1.0-SNAPSHOT
# Autor: maurxp
# ==============================================================================

# Control del portal de salida de bedrock
portal:
  # Cuando portal.enabled es false:
  # BetterDragon NO crea, NO modifica, NO restaura y NO administra el portal
  # de salida de bedrock vanilla en la arena del End.
  # Cuando portal.enabled es true:
  # BetterDragon permite la gestión del portal central tras la victoria.
  enabled: false

# Opciones de logging y depuración
logging:
  # Nivel de detalle en consola: INFO, WARNING, SEVERE
  level: "INFO"
  # Habilitar mensajes de diagnóstico detallados de combate
  debug: false

# ==============================================================================
# FASES DE COMBATE Y HABILIDADES (FASE 3.5)
# ==============================================================================

# Catálogo declarativo de habilidades disponibles para el dragón
# Por defecto se provee un catálogo vacío sin moveset predeterminado
abilities: {}

# Definición de dragones y sus fases de combate ordenadas
dragons:
  default:
    phases:
      - id: "phase_1"
        threshold: 1.00
        abilities: []
      - id: "phase_2"
        threshold: 0.75
        abilities: []
      - id: "phase_3"
        threshold: 0.50
        abilities: []
      - id: "phase_4"
        threshold: 0.25
        abilities: []
